<div class="max-w-4xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold text-gray-900 mb-6">Checkout</h1>

  <div *ngIf="loading" class="flex justify-center py-20">
    <mat-spinner diameter="48"></mat-spinner>
  </div>

  <div *ngIf="!loading && cart" class="max-w-xl mx-auto">
    <h2 class="text-lg font-semibold mb-4">Order Summary</h2>
    <div class="bg-white rounded-lg p-6 shadow-sm space-y-4">
      <div *ngFor="let item of cart.items" class="flex justify-between text-sm">
        <span class="truncate mr-4">{{ item.productTitle }} &times; {{ item.quantity }}</span>
        <span class="font-medium whitespace-nowrap">{{ item.subtotal | currency:'MAD':'symbol':'1.2-2' }}</span>
      </div>

      <mat-divider></mat-divider>

      <div class="flex justify-between text-lg font-bold">
        <span>Total ({{ cart.totalItems }} items)</span>
        <span class="text-indigo-600">{{ cart.totalPrice | currency:'MAD':'symbol':'1.2-2' }}</span>
      </div>

      <div *ngIf="error" class="text-red-600 text-sm bg-red-50 rounded p-3">{{ error }}</div>

      <button
        mat-raised-button
        color="primary"
        class="w-full py-3 text-lg"
        [disabled]="placing"
        (click)="placeOrder()"
      >
        <mat-icon *ngIf="placing" class="align-middle"><mat-spinner diameter="20"></mat-spinner></mat-icon>
        {{ placing ? 'Placing Order...' : 'Confirm Order' }}
      </button>
    </div>
  </div>
</div>
