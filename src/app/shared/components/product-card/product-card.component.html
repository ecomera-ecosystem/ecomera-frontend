<mat-card class="h-full flex flex-col group rounded-xl overflow-hidden border border-line bg-surface-card shadow-card hover:shadow-lift transition-all duration-300 cursor-pointer" (click)="navigateToDetail()">
  <div class="relative aspect-[4/3] bg-surface flex items-center justify-center overflow-hidden">
    <img [src]="primaryImage" [alt]="product.title" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" />
    <div *ngIf="product.discountPercent && product.discountPercent > 0" class="absolute top-2.5 left-2.5 bg-brand text-white text-xs font-semibold px-2.5 py-1 rounded-full shadow">
        -{{ product.discountPercent }}%
    </div>
    <div class="absolute inset-0 bg-ink/0 group-hover:bg-ink/10 transition-colors duration-300 flex items-center justify-center">
      <span class="bg-white text-ink text-xs font-semibold px-4 py-2 rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-300 shadow-card translate-y-2 group-hover:translate-y-0">Quick View</span>
    </div>
  </div>
  <mat-card-content class="flex-1 flex flex-col p-4">
    <span class="text-xs text-brand uppercase tracking-wide font-medium mb-1">{{ product.categoryName }}</span>
    <h3 class="text-sm font-medium text-ink line-clamp-2 mb-2">{{ product.title }}</h3>
    <div class="mt-auto flex items-center justify-between">
      <span class="text-lg font-bold text-ink">{{ product.price | currency:'MAD':'symbol':'1.2-2' }}</span>
      <span *ngIf="product.rating" class="flex items-center gap-1 text-xs text-ink/60">
        <mat-icon style="font-size: 15px; width: 15px; height: 15px;" class="text-[#F5B301]">star</mat-icon>
        {{ product.rating.toFixed(1) }}
      </span>
    </div>
  </mat-card-content>
</mat-card>
