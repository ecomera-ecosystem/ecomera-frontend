<div class="overflow-hidden">
<owl-carousel-o [options]="customOptions" class="w-full h-[250px] md:h-[400px] relative block">
    <ng-template carouselSlide>
        <div class="h-[250px] md:h-[400px] bg-cover bg-center relative flex items-center pl-6 md:pl-14 text-white"
             style="background-image: url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1600&h=500&fit=crop');">
            <div class="absolute inset-0 bg-gradient-to-r from-ink/70 to-ink/20"></div>
            <div class="relative z-10 animate-fade-up">
                <p class="text-brand-light uppercase tracking-widest text-xs font-semibold mb-3">Welcome to Ecomera</p>
                <h1 class="font-display text-3xl md:text-5xl font-bold mb-3 drop-shadow-lg">Discover the latest trends</h1>
                <button mat-flat-button class="!bg-white !text-ink !text-base !px-8 !py-2 rounded-full" routerLink="/search">Shop Now</button>
            </div>
        </div>
    </ng-template>

    <ng-template carouselSlide>
        <div class="h-[250px] md:h-[400px] bg-cover bg-center relative flex items-center pl-6 md:pl-14 text-white"
             style="background-image: url('https://images.unsplash.com/photo-1483985988355-763728e1935b?w=1600&h=500&fit=crop');">
            <div class="absolute inset-0 bg-gradient-to-r from-ink/70 to-ink/20"></div>
            <div class="relative z-10 animate-fade-up">
                <p class="text-brand-light uppercase tracking-widest text-xs font-semibold mb-3">Just in</p>
                <h1 class="font-display text-3xl md:text-5xl font-bold mb-3 drop-shadow-lg">New Arrivals</h1>
                <p class="text-white/90 text-base md:text-xl mb-5 drop-shadow">Fresh styles just for you</p>
                <button mat-flat-button class="!bg-white !text-ink !text-base !px-8 !py-2 rounded-full" routerLink="/search">Explore</button>
            </div>
        </div>
    </ng-template>

    <ng-template carouselSlide>
        <div class="h-[250px] md:h-[400px] bg-cover bg-center relative flex items-center pl-6 md:pl-14 text-white"
             style="background-image: url('https://images.unsplash.com/photo-1607082349566-187342175e2f?w=1600&h=500&fit=crop');">
            <div class="absolute inset-0 bg-gradient-to-r from-ink/70 to-ink/20"></div>
            <div class="relative z-10 animate-fade-up">
                <p class="text-brand-light uppercase tracking-widest text-xs font-semibold mb-3">Limited time</p>
                <h1 class="font-display text-3xl md:text-5xl font-bold mb-3 drop-shadow-lg">Exclusive Offers</h1>
                <p class="text-white/90 text-base md:text-xl mb-5 drop-shadow">Save big on select items</p>
                <button mat-flat-button class="!bg-white !text-ink !text-base !px-8 !py-2 rounded-full" routerLink="/search" [queryParams]="{ q: 'sale' }">See Deals</button>
            </div>
        </div>
    </ng-template>
</owl-carousel-o>
</div>
